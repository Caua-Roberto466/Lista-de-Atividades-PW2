<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contabilizar salário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="processar.php" method="post" onsubmit="return validar()">
        <h3>Cálculo de salário</h3>
        <label for="salario">Insira o salário</label>
        <input type="text" name="sal" id="sal" required placeholder="Digite o preço do produto">
        <p id="erro" style="color: red; font-size: 120%; display: none; font-family: Arial, Helvetica, sans-serif;">Valor inválido! Digite apenas números.</p>
        <button type="submit">Enviar</button>
    </form>

    <script>
        function validar(){
            const campos = ['sal'];
            const erro = document.getElementById('erro');

            for(let id of campos){
                const valor = document.getElementById(id).value;

                if(isNaN(valor) || valor.trim() === '' || valor.includes('.')){
                    erro.style.display = "block";
                    return false;
                }
            }
            erro.style.display = "none";
            return true;
        }
    </script>
</body>
</html>
