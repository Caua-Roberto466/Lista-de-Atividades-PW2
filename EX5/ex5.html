<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soma de quadrados</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="processar.php" method="post" onsubmit="return validar()">
        <h3></h3>
        <label for="num1">Insira o 1º número</label>
        <input type="text" name="num1" id="num1" required placeholder="Digite o preço do produto">
        <br>
        <label for="num2">Insira o 2º número</label>
        <input type="text" name="num2" id="num2" required placeholder="Digite a porcentagem do Desconto">
        <br>
        <label for="num3">Insira o 3º número</label>
        <input type="text" name="num3" id="num3" required placeholder="Digite a porcentagem do Desconto">
        <p id="erro" style="color: red; font-size: 120%; display: none; font-family: Arial, Helvetica, sans-serif;">Valor inválido! Digite apenas números.</p>
        <button type="submit">Enviar</button>
    </form>

    <script>
        function validar(){
            const campos = ['num1', 'num2', 'num3'];
            const erro = document.getElementById('erro');

            for(let id of campos){
                const valor = document.getElementById(id).value;

                if(isNaN(valor) || valor.trim() === '' || valor.includes('.')){
                    erro.style.display = "block";
                    return false;
                }
            }
            erro.style.display = "none";
            return true;
        }
    </script>
</body>
</html>
