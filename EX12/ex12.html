<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista dos ímpares</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="processar.php" method="post" onsubmit="return validar()">
        <h3></h3>
        <label for="inicio">Insira o início</label>
        <input type="text" name="inicio" id="inicio" required placeholder="Digite o início">
        <br>
        <label for="fim">Insira o fim</label>
        <input type="text" name="fim" id="fim" required placeholder="Digite o fim">
        <p id="erro" style="color: red; font-size: 120%; display: none; font-family: Arial, Helvetica, sans-serif;">Valor inválido! Digite apenas números.</p>
        <button type="submit">Enviar</button>
    </form>

    <script>
        function validar(){
            const campos = ['inicio', 'fim'];
            const erro = document.getElementById('erro');

            for(let id of campos){
                const valor = document.getElementById(id).value;

                if(isNaN(valor) || valor.trim() === '' || valor.includes('.')){
                    erro.style.display = "block";
                    return false;
                }
            }
            erro.style.display = "none";
            return true;
        }
    </script>
</body>
</html>
